<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Mini Meesho</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
<h1>Cart</h1>
<button id="back-btn">Back</button>
</header>

<main id="cart-container" style="padding:20px;">
<!-- Cart items -->
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

if(!localStorage.getItem('loggedIn')){
  window.location.href='login.html';
}

const user = JSON.parse(localStorage.getItem('currentUser'));
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const container = document.getElementById('cart-container');

function renderCart(){
  container.innerHTML='';
  if(cart.length===0){
    container.innerHTML="<p>Cart is empty.</p>";
    return;
  }
  let total=0;
  cart.forEach((p,i)=>{
    total += parseInt(p.price.replace('₹',''));
    const div = document.createElement('div');
    div.style.border="1px solid #ccc"; div.style.marginBottom="10px"; div.style.padding="10px";
    div.innerHTML=`<h3>${p.name}</h3><p>Price: ${p.price}</p><button>Remove</button>`;
    div.querySelector('button').addEventListener('click', ()=>{
      cart.splice(i,1);
      localStorage.setItem('cart',JSON.stringify(cart));
      renderCart();
    });
    container.appendChild(div);
  });
  const totalDiv = document.createElement('div');
  totalDiv.innerHTML=`<h3>Total: ₹${total}</h3>`;
  container.appendChild(totalDiv);

  const checkoutBtn = document.createElement('button');
  checkoutBtn.innerText="Checkout";
  checkoutBtn.style.marginTop="10px";
  checkoutBtn.addEventListener('click', async ()=>{
    const name = prompt("Enter your name:");
    const phone = prompt("Enter your phone:");
    const address = prompt("Enter your address:");
    for(const p of cart){
      await addDoc(collection(db,"orders"),{
        userEmail: user.email,
        product: p,
        timestamp: new Date(),
        name, phone, address
      });
    }
    alert("Order placed!");
    localStorage.removeItem('cart');
    window.location.href='orders.html';
  });
  container.appendChild(checkoutBtn);
}

renderCart();

document.getElementById('back-btn').addEventListener('click', ()=>{
  window.location.href='home.html';
});
</script>
</body>
</html>
