<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail - Mini Meesho</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif;}
body{background:linear-gradient(120deg,#fef9f9,#e0f7fa);animation:bg 12s ease infinite;background-size:400% 400%;transition:0.5s;}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(135deg,violet,skyblue);color:white;flex-wrap:wrap;}
header h1{font-size:1.8rem;}
header button{padding:8px 15px;border:none;border-radius:8px;background:white;color:violet;font-weight:bold;cursor:pointer;transition:0.3s;}
header button:hover{transform:scale(1.05);}
main{max-width:600px;margin:20px auto;padding:20px;background:white;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.15);}
main img{width:100%;height:300px;object-fit:cover;border-radius:12px;margin-bottom:15px;}
main h2{color:#333;margin-bottom:10px;}
main p{color:#666;margin-bottom:10px;}
main .price{color:#ff4500;font-weight:bold;margin-bottom:15px;}
main button{padding:10px 15px;border:none;border-radius:10px;background:linear-gradient(135deg,violet,skyblue);color:white;font-weight:bold;margin-right:10px;cursor:pointer;transition:0.3s;}
main button:hover{transform:scale(1.05);}
@keyframes bg{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
</style>
</head>
<body>
<header>
<h1>Product Detail</h1>
<button id="logout-btn">Logout</button>
</header>

<main id="product-detail">
<p>Loading product...</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Redirect if not logged in
if(!localStorage.getItem("loggedIn")){
    alert("Please login first!");
    window.location.href="login.html";
}

const currentUser = JSON.parse(localStorage.getItem("currentUser"));
const productDetail = document.getElementById("product-detail");

// Get selected product from localStorage
const selected = JSON.parse(localStorage.getItem("selectedProduct"));
if(!selected){
    productDetail.innerHTML="<p>No product selected.</p>";
} else {
    productDetail.innerHTML=`
        <img src="${selected.img}" alt="${selected.name}">
        <h2>${selected.name}</h2>
        <p class="price">${selected.price}</p>
        <p>${selected.details}</p>
        <button id="add-cart">Add to Cart</button>
        <button id="buy-now">Buy Now</button>
    `;
}

// Add to Cart / Buy Now
document.getElementById("add-cart")?.addEventListener("click", async ()=>{
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({userEmail: currentUser.email, product:selected});
    localStorage.setItem("cart", JSON.stringify(cart));
    alert("Added to cart!");
});

document.getElementById("buy-now")?.addEventListener("click", async ()=>{
    try{
        await addDoc(collection(db,"orders"),{
            userEmail: currentUser.email,
            product:selected,
            timestamp: new Date()
        });
        alert("Order placed successfully!");
    } catch(e){
        alert("Error placing order: "+e.message);
    }
});

// Logout
document.getElementById("logout-btn").addEventListener("click", ()=>{
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("currentUser");
    window.location.href="login.html";
});
</script>
</body>
</html>
