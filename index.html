<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup - Mini Meesho</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
<h2 id="form-title">Login</h2>
<span class="toggle-link" id="toggle-form">Don't have an account? Signup</span>

<form id="auth-form">
  <div class="input-group">
    <input type="text" id="username" placeholder=" " required>
    <label for="username">Username</label>
  </div>
  <div class="input-group" id="email-group" style="display:none;">
    <input type="email" id="email" placeholder=" ">
    <label for="email">Email</label>
  </div>
  <div class="input-group">
    <input type="password" id="password" placeholder=" " required>
    <label for="password">Password</label>
  </div>
  <button type="submit" id="submit-btn">Login</button>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const toggleLink = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const emailGroup = document.getElementById('email-group');
const submitBtn = document.getElementById('submit-btn');

toggleLink.addEventListener('click', ()=>{
  if(emailGroup.style.display==='none'){
    emailGroup.style.display='block';
    formTitle.innerText='Signup';
    submitBtn.innerText='Signup';
    toggleLink.innerText='Already have an account? Login';
  }else{
    emailGroup.style.display='none';
    formTitle.innerText='Login';
    submitBtn.innerText='Login';
    toggleLink.innerText="Don't have an account? Signup";
  }
});

document.getElementById('auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  if(emailGroup.style.display==='block'){
    const email = document.getElementById('email').value;
    await addDoc(collection(db,"users"),{username,email,password});
    alert('Signup Successful! You can now login.');
    toggleLink.click();
  }else{
    const usersSnapshot = await getDocs(collection(db,"users"));
    const users = [];
    usersSnapshot.forEach(doc=>users.push(doc.data()));
    const user = users.find(u=>u.username===username && u.password===password);
    if(user){
      localStorage.setItem('loggedIn','true');
      localStorage.setItem('currentUser',JSON.stringify(user));
      alert('Login Successful!');
      window.location.href='home.html';
    }else{
      alert('Invalid Credentials!');
    }
  }
});
</script>
</body>
</html>
