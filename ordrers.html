<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Mini Meesho</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
<h1>My Orders</h1>
<button id="back-btn">Back</button>
</header>

<main id="orders-container" style="padding:20px;">
<!-- Orders will render here -->
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

if(!localStorage.getItem('loggedIn')){
  window.location.href='login.html';
}

const user = JSON.parse(localStorage.getItem('currentUser'));
const container = document.getElementById('orders-container');

async function renderOrders(){
  container.innerHTML='';
  const q = query(collection(db,"orders"), where("userEmail","==",user.email));
  const snapshot = await getDocs(q);
  if(snapshot.empty){
    container.innerHTML="<p>No orders yet.</p>";
    return;
  }
  snapshot.forEach(doc=>{
    const data = doc.data();
    const div = document.createElement('div');
    div.style.border="1px solid #ccc"; div.style.marginBottom="10px"; div.style.padding="10px";
    div.innerHTML=`<h3>${data.product.name}</h3>
                   <p>Price: ${data.product.price}</p>
                   <p>${data.product.details}</p>
                   ${data.name?`<p>Name: ${data.name}</p>`:''}
                   ${data.phone?`<p>Phone: ${data.phone}</p>`:''}
                   ${data.address?`<p>Address: ${data.address}</p>`:''}
                   <p>Ordered on: ${data.timestamp.toDate().toLocaleString()}</p>`;
    container.appendChild(div);
  });
}

renderOrders();

document.getElementById('back-btn').addEventListener('click', ()=>{
  window.location.href='home.html';
});
</script>
</body>
</html>
