<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Meesho Cart / Checkout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif;}
body{background:linear-gradient(120deg,#fef9f9,#e0f7fa);animation:bg 12s ease infinite;background-size:400% 400%;transition:0.5s;padding-bottom:80px;}
h1{text-align:center;margin:20px;color:#333;}
.cart-container{max-width:800px;margin:0 auto;padding:20px;}
.cart-item{display:flex;gap:15px;align-items:center;background:white;padding:15px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
.cart-item img{width:100px;height:100px;object-fit:cover;border-radius:10px;}
.cart-item-info{flex:1;}
.cart-item-info h3{margin-bottom:5px;color:#333;}
.cart-item-info p{color:#666;margin-bottom:3px;}
.cart-item-info .price{color:#ff4500;font-weight:bold;}
form{background:white;padding:20px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
form .input-group{margin-bottom:15px;}
form label{display:block;margin-bottom:5px;color:#333;font-weight:bold;}
form input, form textarea{width:100%;padding:10px;border-radius:10px;border:2px solid #ddd;outline:none;font-size:16px;transition:0.3s;}
form input:focus, form textarea:focus{border-color:violet;}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,violet,skyblue);color:white;font-weight:bold;font-size:16px;cursor:pointer;transition:0.3s;}
button:hover{transform:scale(1.05);box-shadow:0 5px 15px rgba(0,0,0,0.2);}
.total-price{text-align:right;font-size:1.2rem;font-weight:bold;margin-bottom:15px;color:#333;}
@keyframes bg{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
</style>
</head>
<body>

<h1>Checkout / Cart</h1>
<div class="cart-container" id="cart-items"></div>

<form id="checkout-form">
<h2>Shipping Details</h2>
<div class="input-group">
<label for="name">Full Name</label>
<input type="text" id="name" required placeholder="Your Name">
</div>
<div class="input-group">
<label for="phone">Phone Number</label>
<input type="tel" id="phone" required placeholder="Your Phone">
</div>
<div class="input-group">
<label for="address">Address</label>
<textarea id="address" required placeholder="Your Address"></textarea>
</div>
<div class="total-price" id="total-price">Total: ₹0</div>
<button type="submit">Place Order</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Check login
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!localStorage.getItem("loggedIn") || !currentUser){
    alert("Please login first!");
    window.location.href="login.html";
}

// Get cart from localStorage
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartContainer = document.getElementById("cart-items");
const totalPriceEl = document.getElementById("total-price");

function renderCart(){
    cartContainer.innerHTML="";
    let total = 0;
    cart.forEach((item,index)=>{
        const div = document.createElement("div");
        div.className="cart-item";
        div.innerHTML=`
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-item-info">
                <h3>${item.name}</h3>
                <p class="price">${item.price}</p>
                <p>${item.details}</p>
            </div>`;
        cartContainer.appendChild(div);
        // Calculate total
        let priceNumber = parseInt(item.price.replace('₹',''));
        total += priceNumber;
    });
    totalPriceEl.innerText = "Total: ₹" + total;
}
renderCart();

// Place Order
document.getElementById("checkout-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    if(cart.length===0){alert("Cart is empty!"); return;}
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;

    for(let item of cart){
        await addDoc(collection(db,"orders"),{
            userEmail: currentUser.email,
            product:item,
            name:name,
            phone:phone,
            address:address,
            timestamp:new Date()
        });
    }

    alert("Order placed successfully!");
    localStorage.removeItem("cart"); // clear cart
    window.location.href="orders.html"; // redirect to Orders page
});
</script>
</body>
</html>
