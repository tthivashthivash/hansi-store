<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Meesho Orders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif;}
body{background:linear-gradient(120deg,#fef9f9,#e0f7fa); animation:bg 12s ease infinite;background-size:400% 400%; transition:0.5s;}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(135deg,violet,skyblue);color:white;flex-wrap:wrap;}
header h1{font-size:1.8rem;}
header button{padding:8px 15px;border:none;border-radius:8px;background:white;color:violet;font-weight:bold;cursor:pointer;transition:0.3s;}
header button:hover{transform:scale(1.05);}
main{max-width:800px;margin:20px auto;padding:20px;}
.order-card{background:white;padding:15px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.15);margin-bottom:20px;}
.order-card h3{color:#333;margin-bottom:8px;}
.order-card p{color:#666;font-size:0.9rem;margin-bottom:5px;}
.order-card .timestamp{color:#999;font-size:0.8rem;text-align:right;}
@keyframes bg{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
</style>
</head>
<body>
<header>
<h1>My Orders</h1>
<button id="logout-btn">Logout</button>
</header>

<main id="orders-list">
<p>Loading orders...</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Redirect if not logged in
if(!localStorage.getItem("loggedIn")){
    alert("Please login first!");
    window.location.href="login.html";
}

const currentUser = JSON.parse(localStorage.getItem("currentUser"));
const ordersList = document.getElementById("orders-list");

async function fetchOrders(){
    ordersList.innerHTML="<p>Loading orders...</p>";
    const q = query(collection(db,"orders"), where("userEmail","==",currentUser.email));
    const snapshot = await getDocs(q);
    ordersList.innerHTML="";
    if(snapshot.empty){
        ordersList.innerHTML="<p>No orders placed yet.</p>";
        return;
    }
    snapshot.forEach(doc=>{
        const data = doc.data();
        const div = document.createElement("div");
        div.className="order-card";
        div.innerHTML=`
          <h3>${data.product.name}</h3>
          <p>Price: ${data.product.price}</p>
          <p>Name: ${data.name}</p>
          <p>Phone: ${data.phone}</p>
          <p>Address: ${data.address}</p>
          <p class="timestamp">${new Date(data.timestamp.seconds*1000).toLocaleString()}</p>
        `;
        ordersList.appendChild(div);
    });
}

fetchOrders();

// Logout
document.getElementById("logout-btn").addEventListener("click", ()=>{
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("currentUser");
  window.location.href="login.html";
});
</script>
</body>
</html>
