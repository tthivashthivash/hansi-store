<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Mini Meesho</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
<h1>Wishlist</h1>
<button id="logout-btn">Logout</button>
</header>

<main id="wishlist-container" style="padding:20px;">
<!-- Wishlist products -->
</main>

<script>
if(!localStorage.getItem('loggedIn')){
  window.location.href='login.html';
}

let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
const container = document.getElementById('wishlist-container');

function renderWishlist(){
  container.innerHTML='';
  if(wishlist.length===0){
    container.innerHTML="<p>Wishlist empty.</p>";
  }else{
    wishlist.forEach(p=>{
      const div = document.createElement('div');
      div.style.border="1px solid #ccc"; div.style.marginBottom="10px"; div.style.padding="10px";
      div.innerHTML=`<h3>${p.name}</h3><p>Price: ${p.price}</p><button>Remove</button>`;
      div.querySelector('button').addEventListener('click',()=>{
        wishlist = wishlist.filter(item=>item.name!==p.name);
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        renderWishlist();
      });
      container.appendChild(div);
    });
  }
}

renderWishlist();

document.getElementById('logout-btn').addEventListener('click',()=>{
  localStorage.removeItem('loggedIn');
  localStorage.removeItem('currentUser');
  window.location.href='login.html';
});
</script>
</body>
</html>
